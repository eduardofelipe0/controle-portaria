# Credenciais fornecidas pelo ambiente; nunca versionar senhas reais.
spring.application.name=controle-portaria
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portaria_db}
spring.datasource.username=${DB_USER:portaria_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Criacao opcional e unica do primeiro administrador.
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.username=${APP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${APP_ADMIN_NAME:Administrador}
app.bootstrap-admin.matricula=${APP_ADMIN_MATRICULA:0000}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.profiles.default=local
