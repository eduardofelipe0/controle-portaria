<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<section th:fragment="corpo">
  <div class="page-heading"><div><div class="eyebrow">GERENCIAMENTO</div><h1>Objetos</h1><p>Registre e acompanhe movimentações de objetos.</p></div><a class="btn btn-primary btn-action" th:href="@{/objetos/new}"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/plus-lg.svg}" alt="" aria-hidden="true"> Novo objeto</a></div>
  <div class="content-card table-card"><div class="filter-bar"><form th:action="@{/objetos/tipo}" method="get" class="filter-select"><label class="visually-hidden" for="tipoEntradaObjeto">Tipo</label><select class="form-select" id="tipoEntradaObjeto" name="tipoEntradaObjeto"><option value="">Todos os tipos</option><option th:each="tipo : ${objs}" th:value="${tipo.name()}" th:text="${tipo.descricao}"></option></select><button class="btn btn-outline-secondary" type="submit">Filtrar</button></form></div>
    <div class="table-responsive"><table class="table app-table"><thead><tr><th>ID</th><th>Responsável / detalhes</th><th>Tipo</th><th>Entrada</th><th>Status</th><th>Saída</th><th>Ações</th></tr></thead><tbody>
      <tr th:each="objeto : ${objetos}"><td th:text="${objeto.id}"></td><td><strong th:text="${objeto.funcionario}"></strong><small class="table-subtext wrap-text" th:text="${objeto.comentario}"></small></td><td th:text="${objeto.tipoEntradaObjeto}"></td><td><span th:text="${#temporals.format(objeto.horaDeEntrada, 'dd/MM/yyyy HH:mm')}"></span><small class="table-subtext" th:text="${objeto.porteiroDeEntrada}"></small></td><td><span class="status-pill" th:classappend="${objeto.status.name() == 'ABERTA' ? ' status-open' : ' status-done'}" th:text="${objeto.status.descricao}"></span></td><td th:text="${objeto.horaDeSaida != null ? #temporals.format(objeto.horaDeSaida, 'dd/MM/yyyy HH:mm') : '—'}"></td><td><div class="table-actions"><a sec:authorize="hasAuthority('ADMIN')" class="action-link" th:href="@{/objetos/editar/{id}(id=${objeto.id})}" title="Editar"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/pencil-square.svg}" alt="" aria-hidden="true"></a><form th:if="${objeto.status.name() == 'ABERTA'}" th:action="@{/objetos/finalizar/{id}(id=${objeto.id})}" method="post" data-confirm="Finalizar esta movimentação?"><button class="action-link action-success" type="submit" title="Finalizar"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/check2-circle.svg}" alt="" aria-hidden="true"></button></form><form sec:authorize="hasAuthority('ADMIN')" th:action="@{/objetos/excluir/{id}(id=${objeto.id})}" method="post" data-confirm="Excluir este objeto permanentemente?"><button class="action-link action-danger" type="submit" title="Excluir"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/trash.svg}" alt="" aria-hidden="true"></button></form></div></td></tr>
      <tr th:if="${#lists.isEmpty(objetos)}"><td colspan="7" class="empty-state">Nenhum objeto encontrado. <a th:href="@{/objetos/new}">Registrar objeto</a></td></tr>
    </tbody></table></div>
  </div>
</section></body></html>
