<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="corpo" class="form-page">
  <div class="page-heading"><div><div class="eyebrow">OBJETOS</div><h1 th:text="${objetoAtual.id == null ? 'Registrar objeto' : 'Editar objeto'}">Registrar objeto</h1><p>Registre uma movimentação com informações claras e completas.</p></div><a class="btn btn-outline-secondary" th:href="@{/objetos/listar}">Voltar aos registros</a></div>
  <div class="content-card form-card"><div class="card-section-title"><span class="step-badge">01</span><div><h2>Dados da movimentação</h2><p>Campos marcados com * são obrigatórios.</p></div></div>
    <form th:action="@{/objetos/cadastrar}" method="post" th:object="${objetoAtual}" novalidate>
      <input type="hidden" th:field="*{id}">
      <div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}"><strong>Verifique os dados informados.</strong><ul class="mb-0"><li th:each="erro : ${#fields.allErrors()}" th:text="${erro}">Erro</li></ul></div>
      <div class="row g-4">
        <div class="col-md-6"><label class="form-label" for="funcionario">Nome do responsável *</label><input class="form-control" th:field="*{funcionario}" id="funcionario" maxlength="30" placeholder="Nome do responsável" required th:errorclass="is-invalid"><div class="invalid-feedback" th:if="${#fields.hasErrors('funcionario')}" th:errors="*{funcionario}"></div></div>
        <div class="col-md-6"><label class="form-label" for="tipoEntradaObjeto">Tipo de movimentação *</label><select class="form-select" th:field="*{tipoEntradaObjeto}" id="tipoEntradaObjeto" required th:errorclass="is-invalid"><option value="">Selecione...</option><option th:each="tipo : ${tipoObjetos}" th:value="${tipo.name()}" th:text="${tipo.descricao}"></option></select><div class="invalid-feedback" th:if="${#fields.hasErrors('tipoEntradaObjeto')}" th:errors="*{tipoEntradaObjeto}"></div></div>
        <div class="col-12"><label class="form-label" for="comentario">Descrição do objeto *</label><textarea class="form-control" th:field="*{comentario}" id="comentario" maxlength="500" rows="5" placeholder="Descreva o objeto e os detalhes relevantes da movimentação" required th:errorclass="is-invalid"></textarea><div class="form-text">Até 500 caracteres.</div><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('comentario')}" th:errors="*{comentario}"></div></div>
      </div>
      <div class="form-actions"><a class="btn btn-light" th:href="@{/objetos/listar}">Cancelar</a><button class="btn btn-primary btn-action" type="submit" th:text="${objetoAtual.id == null ? 'Registrar objeto' : 'Salvar alterações'}">Registrar objeto</button></div>
    </form>
  </div>
</section></body></html>
