<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="corpo" class="form-page">
  <div class="page-heading"><div><div class="eyebrow">VEÍCULOS</div><h1 th:text="${entradaAtual.id == null ? 'Registrar entrada' : 'Editar entrada'}">Registrar entrada</h1><p>Preencha os dados da movimentação do veículo.</p></div><a class="btn btn-outline-secondary" th:href="@{/entradas/listar}">Voltar aos registros</a></div>
  <div class="content-card form-card">
    <div class="card-section-title"><span class="step-badge">01</span><div><h2>Informações do veículo</h2><p>Campos marcados com * são obrigatórios.</p></div></div>
    <form th:action="@{/entradas/registrar}" method="post" th:object="${entradaAtual}" novalidate>
      <input type="hidden" th:field="*{id}">
      <div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}"><strong>Verifique os dados informados.</strong><ul class="mb-0"><li th:each="erro : ${#fields.allErrors()}" th:text="${erro}">Erro</li></ul></div>
      <div class="row g-4">
        <div class="col-md-6"><label class="form-label" for="veiculo">Modelo do veículo *</label><input class="form-control" th:field="*{veiculo}" id="veiculo" maxlength="30" placeholder="Ex.: Honda Civic" required th:errorclass="is-invalid"><div class="invalid-feedback" th:if="${#fields.hasErrors('veiculo')}" th:errors="*{veiculo}"></div></div>
        <div class="col-md-6"><label class="form-label" for="placa">Placa *</label><input class="form-control text-uppercase" th:field="*{placa}" id="placa" maxlength="7" placeholder="ABC1D23" required th:errorclass="is-invalid"><div class="form-text">Formato antigo ou Mercosul, sem hífen.</div><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('placa')}" th:errors="*{placa}"></div></div>
        <div class="col-md-6"><label class="form-label" for="nomeMotorista">Nome do motorista *</label><input class="form-control" th:field="*{nomeMotorista}" id="nomeMotorista" maxlength="30" placeholder="Nome completo" required th:errorclass="is-invalid"><div class="invalid-feedback" th:if="${#fields.hasErrors('nomeMotorista')}" th:errors="*{nomeMotorista}"></div></div>
        <div class="col-md-6"><label class="form-label" for="numeroApt">Unidade / apartamento</label><input class="form-control" th:field="*{numeroApt}" id="numeroApt" maxlength="6" inputmode="numeric" placeholder="Ex.: 101" th:errorclass="is-invalid"><div class="invalid-feedback" th:if="${#fields.hasErrors('numeroApt')}" th:errors="*{numeroApt}"></div></div>
        <div class="col-md-6"><label class="form-label" for="tipo">Tipo de entrada *</label><select class="form-select" th:field="*{tipo}" id="tipo" required th:errorclass="is-invalid"><option value="">Selecione o tipo...</option><option th:each="t : ${tipos}" th:value="${t.name()}" th:text="${t.descricao}">Tipo</option></select><div class="invalid-feedback" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div></div>
      </div>
      <div class="form-actions"><a class="btn btn-light" th:href="@{/entradas/listar}">Cancelar</a><button class="btn btn-primary btn-action" type="submit" th:text="${entradaAtual.id == null ? 'Registrar entrada' : 'Salvar alterações'}">Registrar entrada</button></div>
    </form>
  </div>
</section></body></html>
