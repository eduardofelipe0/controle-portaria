<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<section th:fragment="corpo">
  <div class="page-heading"><div><div class="eyebrow">GERENCIAMENTO</div><h1>Veículos</h1><p>Acompanhe entradas, saídas e histórico de movimentações.</p></div><div class="page-actions"><a class="btn btn-outline-secondary" th:href="@{/entradas/export/pdf}" sec:authorize="hasAuthority('ADMIN')"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/file-earmark-arrow-down.svg}" alt="" aria-hidden="true"> Exportar PDF</a><a class="btn btn-primary btn-action" th:href="@{/entradas/new}"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/plus-lg.svg}" alt="" aria-hidden="true"> Nova entrada</a></div></div>
  <div class="content-card table-card"><div class="filter-bar"><form th:action="@{/entradas/buscar}" method="get" class="filter-search"><label class="visually-hidden" for="buscarEntrada">Buscar placa</label><input id="buscarEntrada" type="search" class="form-control" name="buscarEntrada" placeholder="Buscar pela placa..."><button class="btn btn-outline-secondary" type="submit"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/search.svg}" alt="" aria-hidden="true"> Buscar</button></form><form th:action="@{/entradas/status}" method="get" class="filter-select"><label class="visually-hidden" for="statusEntrada">Filtrar status</label><select id="statusEntrada" name="statusEntrada" class="form-select"><option value="">Todos os status</option><option th:each="status : ${stattus}" th:value="${status.name()}" th:text="${status.descricao}"></option></select><button class="btn btn-outline-secondary" type="submit">Filtrar</button></form>
  <form class="filter-dates" th:action="@{/entradas/intervalo}" method="get">
    <label for="dataInicio" class="form-label">De</label><input class="form-control" id="dataInicio" name="dataInicio" type="datetime-local" required>
    <label for="dataFim" class="form-label">Até</label><input class="form-control" id="dataFim" name="dataFim" type="datetime-local" required>
    <button class="btn btn-outline-secondary" type="submit">Filtrar datas</button>
  </form>
  </div>
   <div class="table-responsive"><table class="table app-table"><thead><tr><th>ID</th><th>Veículo / placa</th><th>Motorista</th><th>Tipo</th><th>Unidade</th><th>Entrada</th><th>Status</th><th>Saída</th><th>Ações</th></tr></thead><tbody>
      <tr th:each="entrada : ${entradas}"><td th:text="${entrada.id}"></td><td><strong th:text="${entrada.veiculo}"></strong><small class="table-subtext" th:text="${entrada.placa}"></small></td><td th:text="${entrada.nomeMotorista}"></td><td th:text="${entrada.tipo}"></td><td th:text="${entrada.numeroApt} ?: '—'"></td><td><span th:text="${#temporals.format(entrada.horaEntrada, 'dd/MM/yyyy HH:mm')}"></span><small class="table-subtext" th:text="${entrada.usuarioDaEntrada}"></small></td><td><span class="status-pill" th:classappend="${entrada.status.name() == 'ABERTA' ? ' status-open' : ' status-done'}" th:text="${entrada.status.descricao}"></span></td><td th:text="${entrada.horaSaida != null ? #temporals.format(entrada.horaSaida, 'dd/MM/yyyy HH:mm') : '—'}"></td><td><div class="table-actions"><a sec:authorize="hasAuthority('ADMIN')" th:if="${entrada.checaStatus()}" class="action-link" th:href="@{/entradas/editar/{id}(id=${entrada.id})}" title="Editar"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/pencil-square.svg}" alt="" aria-hidden="true"></a><form th:if="${entrada.checaStatus()}" th:action="@{/entradas/finalizar/{id}(id=${entrada.id})}" method="post" data-confirm="Finalizar esta entrada?"><button type="submit" class="action-link action-success" title="Finalizar"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/check2-circle.svg}" alt="" aria-hidden="true"></button></form><form sec:authorize="hasAuthority('ADMIN')" th:action="@{/entradas/excluir/{id}(id=${entrada.id})}" method="post" data-confirm="Excluir esta entrada permanentemente?"><button type="submit" class="action-link action-danger" title="Excluir"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/trash.svg}" alt="" aria-hidden="true"></button></form></div></td></tr>
      <tr th:if="${#lists.isEmpty(entradas)}"><td colspan="9" class="empty-state">Nenhuma entrada encontrada. <a th:href="@{/entradas/new}">Registrar entrada</a></td></tr>
    </tbody></table></div>
  </div>
</section></body></html>
