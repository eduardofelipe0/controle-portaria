<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="corpo" class="form-page">
  <div class="page-heading"><div><div class="eyebrow">ADMINISTRAÇÃO</div><h1 th:text="${usuarioAtual.id == null ? 'Cadastrar usuário' : 'Editar usuário'}">Cadastrar usuário</h1><p>Gerencie informações de acesso e permissões.</p></div><a class="btn btn-outline-secondary" th:href="@{/usuarios/listar}">Voltar aos usuários</a></div>
  <div class="content-card form-card"><div class="card-section-title"><span class="step-badge">01</span><div><h2>Dados da conta</h2><p>Campos marcados com * são obrigatórios.</p></div></div>
    <form th:action="@{/usuarios/cadastrar}" method="post" th:object="${usuarioAtual}" novalidate>
      <input type="hidden" th:field="*{id}">
      <div class="alert alert-danger" role="alert" th:if="${#fields.hasAnyErrors()}"><strong>Não foi possível salvar o usuário.</strong><ul class="mb-0"><li th:each="erro : ${#fields.allErrors()}" th:text="${erro}">Erro</li></ul></div>
      <div class="row g-4">
        <div class="col-md-6"><label class="form-label" for="nome">Nome completo *</label><input class="form-control" th:field="*{nome}" id="nome" maxlength="40" placeholder="Nome do usuário" required th:errorclass="is-invalid"><div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div></div>
        <div class="col-md-6"><label class="form-label" for="matricula">Matrícula *</label><input class="form-control" th:field="*{matricula}" id="matricula" maxlength="10" inputmode="numeric" placeholder="Ex.: 0001" required th:errorclass="is-invalid"><div class="invalid-feedback" th:if="${#fields.hasErrors('matricula')}" th:errors="*{matricula}"></div></div>
        <div class="col-md-6"><label class="form-label" for="nomeUsuario">Nome de usuário *</label><input class="form-control" th:field="*{nomeUsuario}" id="nomeUsuario" maxlength="30" placeholder="Ex.: operador01" autocomplete="off" required th:errorclass="is-invalid"><div class="invalid-feedback" th:if="${#fields.hasErrors('nomeUsuario')}" th:errors="*{nomeUsuario}"></div></div>
        <div class="col-md-6"><label class="form-label" for="role">Permissão *</label><select class="form-select" th:field="*{role}" id="role" required th:errorclass="is-invalid"><option value="">Selecione...</option><option th:each="role : ${roles}" th:value="${role.name()}" th:text="${role.descricao}"></option></select><div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div></div>
        <div class="col-12"><label class="form-label" for="senha">Senha <span th:text="${usuarioAtual.id == null ? '*' : '(opcional na edição)'}">*</span></label><div class="password-field"><input class="form-control" type="password" name="senha" id="senha" minlength="12" maxlength="100" autocomplete="new-password" placeholder="Mínimo de 12 caracteres" th:required="${usuarioAtual.id == null}"><button class="reveal-btn" type="button" data-password-toggle="senha" aria-label="Mostrar senha" aria-pressed="false"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/eye.svg}" alt="" aria-hidden="true"></button></div><div class="form-text" th:text="${usuarioAtual.id == null ? 'Use uma senha de pelo menos 12 caracteres.' : 'Deixe em branco para manter a senha atual.'}"></div></div>
      </div>
      <div class="form-actions"><a class="btn btn-light" th:href="@{/usuarios/listar}">Cancelar</a><button class="btn btn-primary btn-action" type="submit" th:text="${usuarioAtual.id == null ? 'Cadastrar usuário' : 'Salvar alterações'}">Salvar usuário</button></div>
    </form>
  </div>
</section></body></html>
