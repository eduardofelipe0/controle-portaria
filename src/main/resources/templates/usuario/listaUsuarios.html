<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="corpo">
  <div class="page-heading"><div><div class="eyebrow">ADMINISTRAÇÃO</div><h1>Usuários</h1><p>Gerencie contas, permissões e acessos à plataforma.</p></div><a class="btn btn-primary btn-action" th:href="@{/usuarios/new}"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/person-plus.svg}" alt="" aria-hidden="true"> Novo usuário</a></div>
  <div class="content-card table-card"><div class="filter-bar"><form class="filter-search" method="get" th:action="@{/usuarios/buscar}"><label class="visually-hidden" for="buscarUsuario">Pesquisar usuário</label><input class="form-control" id="buscarUsuario" type="search" name="buscarUsuario" placeholder="Buscar pelo nome..."><button class="btn btn-outline-secondary" type="submit"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/search.svg}" alt="" aria-hidden="true"> Buscar</button></form><form class="filter-select" th:action="@{/usuarios/permissao}" method="get"><label class="visually-hidden" for="roleFilter">Permissão</label><select id="roleFilter" name="role" class="form-select"><option value="">Todas as permissões</option><option th:each="role : ${roles}" th:value="${role.name()}" th:text="${role.descricao}"></option></select><button class="btn btn-outline-secondary" type="submit">Filtrar</button></form></div>
    <div class="table-responsive"><table class="table app-table"><thead><tr><th>ID</th><th>Nome</th><th>Usuário</th><th>Matrícula</th><th>Permissão</th><th>Ações</th></tr></thead><tbody>
      <tr th:each="usuario : ${usuarios}"><td th:text="${usuario.id}"></td><td><strong th:text="${usuario.nome}"></strong></td><td th:text="${usuario.nomeUsuario}"></td><td th:text="${usuario.matricula}"></td><td><span class="status-pill status-role" th:text="${usuario.role.descricao}"></span></td><td><div class="table-actions"><a class="action-link" th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" title="Editar"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/pencil-square.svg}" alt="" aria-hidden="true"></a><form th:action="@{/usuarios/excluir/{id}(id=${usuario.id})}" method="post" data-confirm="Excluir esta conta de usuário?"><button type="submit" class="action-link action-danger" title="Excluir"><img class="ui-icon" th:src="@{/bootstrap-5.1.3-dist/icons/icons/trash.svg}" alt="" aria-hidden="true"></button></form></div></td></tr>
      <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="6" class="empty-state">Nenhum usuário encontrado. <a th:href="@{/usuarios/new}">Cadastrar usuário</a></td></tr>
    </tbody></table></div>
  </div>
</section></body></html>
