<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132b46">
  <title th:text="${pageTitle != null ? pageTitle + ' | Controle de Portaria' : 'Controle de Portaria'}">Controle de Portaria</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <link rel="stylesheet" th:href="@{/bootstrap-5.1.3-dist/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/style/style.css}">
</head>
<body class="app-body">
  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>
  <aside th:replace="~{fragmento/header :: cabecalho}"></aside>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle icon-btn" id="sidebarToggle" type="button" aria-label="Abrir ou fechar menu" aria-controls="appSidebar" aria-expanded="false">
          <img th:src="@{/bootstrap-5.1.3-dist/icons/icons/list.svg}" alt="">
        </button>
        <div class="topbar-breadcrumb"><span class="topbar-brand-sm">Controle de Portaria</span><span class="breadcrumb-sep">/</span><strong th:text="${pageTitle} ?: 'Visão geral'">Visão geral</strong></div>
      </div>
      <div class="topbar-right"><span class="online-dot"></span><span class="topbar-online">Sistema online</span><span class="topbar-avatar" aria-hidden="true">CP</span></div>
    </header>
    <main class="app-main" id="main-content">
      <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="status">
        <span th:text="${message}">Operação realizada.</span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
      </div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
      </div>
      <div th:replace="~{${conteudo} :: corpo}"></div>
    </main>
  </div>
  <script th:src="@{/bootstrap-5.1.3-dist/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/app.js}"></script>
</body>
</html>
